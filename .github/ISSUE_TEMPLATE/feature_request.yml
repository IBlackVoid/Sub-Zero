name: Feature request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this feature solve?
      placeholder: "I'm always frustrated when ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should this work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about.

  - type: dropdown
    id: scope
    attributes:
      label: Component
      options:
        - Engine (core pipeline)
        - TUI (dashboard)
        - CLI (arguments, flags)
        - Quality gate (learned model)
        - DOOM-QLOCK (adaptive scheduler)
        - Documentation
        - CI / DevOps
        - Other
    validations:
      required: true
