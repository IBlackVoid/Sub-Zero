name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Linux audio headers (rodio)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: cargo build
        run: cargo build --workspace

      - name: cargo test (engine unit tests)
        run: cargo test --bin sub-zero

      - name: cargo test (tui unit tests)
        run: cargo test -p sub-zero-tui
