name: release

# Triggered by pushing a semver tag (e.g. `v0.1.0`). The workflow:
#   1. Cross-builds the `voidex` and `voidex-tui` binaries for four
#      first-class targets.
#   2. Strips the binaries, archives them, and emits SHA-256 checksums.
#   3. Uploads each archive + its checksum as a workflow artifact.
#   4. After all builds succeed, drafts a GitHub Release and attaches every
#      archive and checksum.
#
# A failed `build` job blocks the release; the release is never published
# from a partial matrix.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive-ext: tar.gz
            bin-ext: ""
          - target: x86_64-apple-darwin
            runner: macos-13
            archive-ext: tar.gz
            bin-ext: ""
          - target: aarch64-apple-darwin
            runner: macos-14
            archive-ext: tar.gz
            bin-ext: ""
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive-ext: zip
            bin-ext: .exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (with target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux audio headers (rodio, ubuntu only)
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: cargo build --release --locked
        run: cargo build --release --locked --workspace --target ${{ matrix.target }}

      - name: Stage archive contents
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          stage="voidex-${version}-${{ matrix.target }}"
          mkdir -p "dist/${stage}"
          cp "target/${{ matrix.target }}/release/voidex${{ matrix.bin-ext }}" "dist/${stage}/"
          cp "target/${{ matrix.target }}/release/voidex-tui${{ matrix.bin-ext }}" "dist/${stage}/"
          cp README.md LICENSE "dist/${stage}/"
          echo "STAGE=${stage}" >> "$GITHUB_ENV"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Archive (tar.gz, unix)
        if: matrix.archive-ext == 'tar.gz'
        shell: bash
        working-directory: dist
        run: |
          tar -czf "${STAGE}.tar.gz" "${STAGE}"
          shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"

      - name: Archive (zip, windows)
        if: matrix.archive-ext == 'zip'
        shell: pwsh
        working-directory: dist
        run: |
          Compress-Archive -Path $env:STAGE -DestinationPath "$env:STAGE.zip"
          $hash = Get-FileHash -Algorithm SHA256 "$env:STAGE.zip"
          # GNU coreutils style: "<hash>  <filename>"
          "$($hash.Hash.ToLower())  $env:STAGE.zip" | Out-File -Encoding ascii "$env:STAGE.zip.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STAGE }}
          path: |
            dist/${{ env.STAGE }}.${{ matrix.archive-ext }}
            dist/${{ env.STAGE }}.${{ matrix.archive-ext }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    # Skip release for manual workflow_dispatch runs (build-only check).
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact tree
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -exec cp -v {} release/ \;
          ls -la release

      - name: Aggregate SHA256SUMS
        working-directory: release
        run: |
          set -euo pipefail
          # Combine all per-file checksums into one canonical SHA256SUMS file.
          cat *.sha256 | sort > SHA256SUMS
          rm -f *.sha256
          cat SHA256SUMS

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS
