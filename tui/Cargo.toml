[package]
name = "sub-zero-tui"
version = "0.1.0"
edition = "2021"
authors = ["IBVoid"]
description = "Live dashboard for Sub-Zero — ratatui frontend over the engine event stream."

[dependencies]
ratatui   = "0.28"
crossterm = "0.28"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
# Audio playback for video animations only. The TUI auto-detects a
# sibling `.wav` next to the JSONL and starts playback on switch.
# Any failure to open an audio device is non-fatal — visuals continue.
rodio     = { version = "0.20", default-features = false, features = ["wav"] }
# Pure-Rust SHA-256 used by the hidden-content gate: source code only
# ever holds the 32-byte digest of each secret phrase, never the phrase
# itself. The same hash drives a CTR-style keystream that encrypts the
# easter-egg manifest and assets at rest.
sha2      = "0.10"

[[bin]]
name = "sub-zero-tui"
path = "src/main.rs"
